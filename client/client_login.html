<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員登入 | MEMBER LOGIN</title>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500&family=Noto+Sans+TC:wght@300;400&family=Plus+Jakarta+Sans:wght@200;300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <style>
        :root {
            --champagne-gold: #C5A059;
            --dark-gold: #A68648;
            --text-main: #2D2520;
            --text-muted: #5e5248;
            --serif-luxury: 'Bodoni Moda', serif;
            --sans: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-style: normal;
        }

        body {
            font-family: var(--sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background-color: #D9CFC4;
            background-image:
                radial-gradient(ellipse 70% 50% at 15% 20%, rgba(197, 160, 89, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse 60% 60% at 85% 80%, rgba(180, 140, 70, 0.15) 0%, transparent 50%);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(197, 160, 89, 0.09) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
            z-index: 0;
        }

        .watermark {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .wm-text {
            font-family: var(--serif-luxury);
            font-weight: 400;
            line-height: 0.82;
            text-transform: uppercase;
            white-space: nowrap;
            color: transparent;
            -webkit-text-stroke: 1px rgba(197, 160, 89, 0.1);
        }

        .wm-1 { font-size: 36vw; transform: translateY(-4vh); }
        .wm-2 { font-size: 22vw; transform: translate(12vw, -6vh); opacity: 0.55; }

        .page-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            width: 100%;
        }

        /* ── 卡片：加寬加高 ── */
        .login-card {
            background: rgba(255, 253, 249, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(197, 160, 89, 0.2);
            border-radius: 14px;
            padding: 3.5rem 3rem;       /* 加大內距 */
            width: 100%;
            max-width: 520px;           /* 加寬 */
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.75) inset,
                0 20px 70px rgba(100, 70, 20, 0.18),
                0 4px 16px rgba(197, 160, 89, 0.1);
            animation: card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (min-width: 640px) {
            .login-card { padding: 4rem 3.5rem; }
        }

        /* ── 標題 ── */
        .card-header {
            text-align: center;
            margin-bottom: 2.75rem;
        }

        .luxury-title {
            font-family: var(--serif-luxury);
            font-size: 26px;            /* 放大 */
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .luxury-subtitle {
            font-size: 10px;            /* 放大 */
            letter-spacing: 0.55em;
            color: var(--champagne-gold);
            text-transform: uppercase;
            margin-top: 0.7rem;
            font-weight: 400;
        }

        .header-divider {
            width: 36px;
            height: 1px;
            background: rgba(197, 160, 89, 0.3);
            margin: 1.25rem auto 0;
        }

        /* ── 表單 ── */
        .form-field {
            margin-bottom: 2rem;        /* 間距加大 */
        }

        .label-minimal {
            display: block;
            font-size: 11px;            /* 放大 */
            font-weight: 500;           /* 加粗 */
            text-transform: uppercase;
            letter-spacing: 0.4em;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
        }

        .field-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 0.6rem;
        }

        .input-wrap { position: relative; }

        .input-minimal-gold {
            width: 100%;
            background: rgba(245, 240, 232, 0.6);
            border: 1px solid rgba(197, 160, 89, 0.28);
            border-radius: 8px;
            padding: 1rem 1.1rem;       /* 加高輸入框 */
            font-size: 15px;            /* 放大 */
            font-weight: 400;           /* 加粗 */
            letter-spacing: 0.05em;
            color: #2D2520;
            font-family: var(--sans);
            transition: border-color 0.4s ease, background 0.4s ease, box-shadow 0.4s ease;
        }

        .input-minimal-gold:focus {
            outline: none;
            border-color: rgba(197, 160, 89, 0.6);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.1);
        }

        .input-minimal-gold::placeholder {
            color: rgba(80, 65, 50, 0.4);
            font-weight: 300;
        }

        .input-minimal-gold.has-icon {
            padding-right: 3.2rem;
        }

        .toggle-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(138, 125, 112, 0.5);
            padding: 0;
            display: flex;
            transition: color 0.3s ease;
        }

        .toggle-btn:hover { color: var(--champagne-gold); }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 200, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }

        .forgot-link {
            font-size: 11px;            /* 放大 */
            font-weight: 400;
            letter-spacing: 0.25em;
            color: var(--champagne-gold);
            text-decoration: none;
            opacity: 0.85;
            transition: opacity 0.3s;
        }

        .forgot-link:hover { opacity: 1; }

        /* ── 按鈕 ── */
        .btn-gold-submit {
            width: 100%;
            background: linear-gradient(135deg, #C5A059 0%, #A68648 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 1.1rem;            /* 加高 */
            font-size: 13px;            /* 放大 */
            font-weight: 500;           /* 加粗 */
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-family: var(--sans);
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 18px rgba(197, 160, 89, 0.3);
            margin-top: 0.75rem;
        }

        .btn-gold-submit:hover {
            background: linear-gradient(135deg, #d4b06a 0%, #C5A059 100%);
            box-shadow: 0 6px 28px rgba(197, 160, 89, 0.4);
            transform: translateY(-1px);
        }

        .btn-gold-submit:active { transform: translateY(0); }

        /* ── 底部裝飾 ── */
        .bottom-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            margin-top: 3rem;
            opacity: 0.22;
        }

        .deco-line {
            height: 0.5px;
            width: 28px;
            background: var(--champagne-gold);
        }

        .deco-text {
            font-size: 8px;
            font-weight: 400;
            letter-spacing: 0.7em;
            text-transform: uppercase;
            color: var(--champagne-gold);
        }
    </style>
</head>
<body>

    <div class="watermark">
        <div class="wm-text wm-1">ETERNAL</div>
        <div class="wm-text wm-2">VENUES</div>
    </div>

    <main class="page-wrapper">
        <div class="login-card">

            <div class="card-header">
                <h2 class="luxury-title">會員登入</h2>
                <p class="luxury-subtitle">The Art of Eternal Celebration</p>
                <div class="header-divider"></div>
            </div>

            <form onsubmit="return false;">

                <div class="form-field">
                    <label class="label-minimal">Account / Email</label>
                    <div class="input-wrap">
                        <input type="text" class="input-minimal-gold" placeholder="電子郵件或手機號碼" autocomplete="email">
                    </div>
                </div>

                <div class="form-field">
                    <div class="field-header">
                        <label class="label-minimal" style="margin-bottom:0;">Password</label>
                        <a href="#" class="forgot-link">忘記密碼?</a>
                    </div>
                    <div class="input-wrap">
                        <input type="password" id="passwordInput" class="input-minimal-gold has-icon" placeholder="請輸入密碼" autocomplete="current-password">
                        <button class="toggle-btn" type="button" onclick="togglePassword(this)">
                            <span class="material-symbols-outlined">visibility</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-gold-submit">
                    立即登入 &nbsp;|&nbsp; LOGIN
                </button>

            </form>

            <div class="bottom-decoration">
                <div class="deco-line"></div>
                <span class="deco-text">Fine Wedding Selection</span>
                <div class="deco-line"></div>
            </div>

        </div>
    </main>

    <script>
        function togglePassword(btn) {
            const input = document.getElementById('passwordInput');
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }
    </script>
</body>
</html>
