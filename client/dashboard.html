<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的籌備進度 | Eternal Story Wedding Planner</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --es-gold: #cda87c;
        }

        .bg-es-gold {
            background-color: var(--es-gold) !important;
        }

        .text-es-gold {
            color: var(--es-gold) !important;
        }

        /* 時間軸樣式 */
        .timeline {
            border-left: 3px solid #f1f3f5;
            position: relative;
            list-style: none;
            padding-left: 30px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
        }

        .timeline-item::before {
            content: "";
            background: #fff;
            border: 3px solid var(--es-gold);
            display: inline-block;
            position: absolute;
            left: -42px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            z-index: 1;
            top: 5px;
        }

        .timeline-item.completed::before {
            background: var(--es-gold);
        }

        .progress-card {
            border-radius: 15px;
            border: none;
            transition: transform 0.3s;
        }

        .progress-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-white bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-es-gold" href="index.html">Eternal Story</a>
            <div class="d-flex align-items-center">
                <span class="me-3 small text-muted">歡迎回來, 王小明 & 陳小姐</span>
                <a href="../login.html" class="btn btn-sm btn-outline-secondary rounded-pill">登出</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card progress-card shadow-sm p-4 mb-4">
                    <h5 class="fw-bold mb-4">婚禮倒數</h5>
                    <div class="text-center">
                        <h2 class="display-4 fw-bold text-es-gold mb-1">125</h2>
                        <p class="text-muted">DAYS TO GO</p>
                    </div>
                    <hr>
                    <div class="small">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">婚禮日期</span>
                            <span class="fw-bold">2026-07-05</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">負責顧問</span>
                            <span class="fw-bold">Jack (小傑)</span>
                        </div>
                    </div>
                </div>

                <div class="card progress-card shadow-sm p-4">
                    <h5 class="fw-bold mb-3">我的文件</h5>
                    <div class="list-group list-group-flush">
                        <a href="#" class="list-group-item list-group-item-action border-0 px-0 small">
                            <i class="bi bi-file-earmark-pdf text-danger me-2"></i> 婚宴合約書.pdf
                        </a>
                        <a href="#" class="list-group-item list-group-item-action border-0 px-0 small">
                            <i class="bi bi-file-earmark-image text-primary me-2"></i> 佈置模擬圖_初稿.jpg
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card progress-card shadow-sm p-4 p-md-5">
                    <h4 class="fw-bold mb-5"><i class="bi bi-calendar-check text-es-gold me-2"></i>籌備進度追蹤</h4>

                    <ul class="timeline">
                        <li class="timeline-item completed">
                            <div class="d-flex justify-content-between">
                                <h6 class="fw-bold">簽約與初步需求溝通</h6>
                                <span class="badge bg-success rounded-pill mb-auto">已完成</span>
                            </div>
                            <p class="text-muted small">確認服務內容、婚期與初步預算規畫。</p>
                        </li>

                        <li class="timeline-item">
                            <div class="d-flex justify-content-between">
                                <h6 class="fw-bold">主題視覺與場地佈置設計</h6>
                                <span class="badge bg-warning text-dark rounded-pill mb-auto">進行中</span>
                            </div>
                            <p class="text-muted small">顧問正在根據您的喜好產出佈置草圖，預計下週提供。</p>
                        </li>

                        <li class="timeline-item">
                            <div class="d-flex justify-content-between">
                                <h6 class="fw-bold">攝影師與新秘老師對接</h6>
                                <span class="badge bg-light text-muted rounded-pill mb-auto">待開始</span>
                            </div>
                            <p class="text-muted small">預計於婚前三個月開始進行細節溝通。</p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
