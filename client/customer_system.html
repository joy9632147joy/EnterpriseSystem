<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Wedding Vision Proposal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@300;400;500&display=swap');
        
        :root {
            --soft-grey: #EFECE5; --border-grey: #EBE7E0; --accent-gold: #BCAE9B; 
            --text-main: #3A3836; --text-muted: #8F8B86;
        }

        body { background-color: var(--soft-grey); color: var(--text-main); font-family: "Noto Sans TC", sans-serif; overflow-x: hidden; }
        .serif { font-family: "Noto Serif TC", serif; }
        
        /* 內容切換動畫 */
        .step-content { display: none; transform: translateY(20px); opacity: 0; transition: all 0.5s ease; }
        .step-content.active { display: block; transform: translateY(0); opacity: 1; }

        /* 進度條指示器 */
        .dot { height: 8px; width: 8px; background-color: #D1CDC7; border-radius: 50%; transition: all 0.3s; }
        .dot.active { width: 24px; background-color: var(--accent-gold); border-radius: 4px; }

        /* 選項點擊效果 */
        .option-card { border: 1px solid var(--border-grey); transition: all 0.3s; cursor: pointer; background: white; }
        .option-card.selected { border-color: var(--accent-gold); background-color: #F9F8F6; box-shadow: 0 4px 12px rgba(188, 174, 155, 0.15); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <div class="fixed top-12 flex space-x-3 items-center">
        <div class="dot active" id="dot-1"></div>
        <div class="dot" id="dot-2"></div>
        <div class="dot" id="dot-3"></div>
        <div class="dot" id="dot-4"></div>
    </div>

    <div class="w-full max-w-2xl bg-white/60 backdrop-blur-md rounded-[3rem] p-10 md:p-16 shadow-xl border border-white/50 relative">
        
        <div id="step-1" class="step-content active text-center">
            <span class="text-[10px] tracking-[0.3em] text-[#BCAE9B] font-bold uppercase">Phase 01</span>
            <h2 class="serif text-3xl mt-4 mb-8">定義您的婚禮氣息</h2>
            <div class="grid grid-cols-1 gap-4">
                <div class="option-card p-6 rounded-2xl text-left" onclick="selectOption(this, 1)">
                    <h4 class="font-bold">經典美式戶外</h4>
                    <p class="text-xs text-[#8F8B86] mt-1">草地證婚、長桌晚宴、輕鬆派對感</p>
                </div>
                <div class="option-card p-6 rounded-2xl text-left" onclick="selectOption(this, 1)">
                    <h4 class="font-bold">飯店室內盛宴</h4>
                    <p class="text-xs text-[#8F8B86] mt-1">華麗燈光、隆重進場、氣派圓桌</p>
                </div>
                <div class="option-card p-6 rounded-2xl text-left" onclick="selectOption(this, 1)">
                    <h4 class="font-bold">私宅溫馨家宴</h4>
                    <p class="text-xs text-[#8F8B86] mt-1">小眾精緻、深度交流、像家一樣溫暖</p>
                </div>
            </div>
        </div>

        <div id="step-2" class="step-content text-center">
            <span class="text-[10px] tracking-[0.3em] text-[#BCAE9B] font-bold uppercase">Phase 02</span>
            <h2 class="serif text-3xl mt-4 mb-8">您理想中的流程節奏</h2>
            <div class="space-y-6 text-left">
                <div class="p-6 bg-white/80 rounded-2xl border border-[#EBE7E0]">
                    <p class="text-sm font-bold mb-4">這場婚禮中，您最期待哪個環節？</p>
                    <div class="flex flex-wrap gap-3">
                        <button class="px-4 py-2 border rounded-full text-xs hover:border-[#BCAE9B]" onclick="this.classList.toggle('bg-[#BCAE9B]'); this.classList.toggle('text-white')">證婚儀式</button>
                        <button class="px-4 py-2 border rounded-full text-xs hover:border-[#BCAE9B]" onclick="this.classList.toggle('bg-[#BCAE9B]'); this.classList.toggle('text-white')">驚喜進場</button>
                        <button class="px-4 py-2 border rounded-full text-xs hover:border-[#BCAE9B]" onclick="this.classList.toggle('bg-[#BCAE9B]'); this.classList.toggle('text-white')">深度敬酒</button>
                        <button class="px-4 py-2 border rounded-full text-xs hover:border-[#BCAE9B]" onclick="this.classList.toggle('bg-[#BCAE9B]'); this.classList.toggle('text-white')">After Party</button>
                    </div>
                </div>
                <textarea class="w-full p-4 bg-transparent border-b border-[#EBE7E0] outline-none text-sm italic" placeholder="關於流程，還有什麼特別想實現的願望嗎？"></textarea>
            </div>
        </div>

        <div id="step-3" class="step-content text-center">
            <span class="text-[10px] tracking-[0.3em] text-[#BCAE9B] font-bold uppercase">Phase 03</span>
            <h2 class="serif text-3xl mt-4 mb-8">資源分配的優先權</h2>
            <p class="text-xs text-[#8F8B86] mb-10">拖動下方滑桿，告訴我們您最看重的領域</p>
            <div class="space-y-10">
                <div class="px-4">
                    <div class="flex justify-between text-[10px] font-bold text-[#BCAE9B] mb-2"><span>視覺佈置</span> <span id="val1">50%</span></div>
                    <input type="range" class="w-full accent-[#BCAE9B]" oninput="document.getElementById('val1').innerText = this.value + '%'">
                </div>
                <div class="px-4">
                    <div class="flex justify-between text-[10px] font-bold text-[#BCAE9B] mb-2"><span>紀錄(攝錄影)</span> <span id="val2">50%</span></div>
                    <input type="range" class="w-full accent-[#BCAE9B]" oninput="document.getElementById('val2').innerText = this.value + '%'">
                </div>
            </div>
        </div>

        <div id="step-4" class="step-content text-center">
            <span class="text-[10px] tracking-[0.3em] text-[#BCAE9B] font-bold uppercase">Phase 04</span>
            <h2 class="serif text-3xl mt-4 mb-8">顧問服務深度需求</h2>
            <div class="bg-[#F9F8F6] p-8 rounded-[2rem] text-left space-y-4">
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm">婚禮統籌進度管控</span>
                    <input type="checkbox" checked class="w-5 h-5 accent-[#BCAE9B]">
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm">視覺設計與美感執行</span>
                    <input type="checkbox" checked class="w-5 h-5 accent-[#BCAE9B]">
                </label>
                <label class="flex items-center justify-between cursor-pointer">
                    <span class="text-sm">廠商對接與談判</span>
                    <input type="checkbox" class="w-5 h-5 accent-[#BCAE9B]">
                </label>
            </div>
        </div>

        <div class="mt-12 flex justify-between items-center">
            <button id="prevBtn" onclick="nextStep(-1)" class="text-[12px] font-bold text-[#8F8B86] opacity-0 pointer-events-none transition">PREV</button>
            <button id="nextBtn" onclick="nextStep(1)" class="bg-[#BCAE9B] text-white px-10 py-4 rounded-full font-bold shadow-lg hover:bg-[#A89A87] transition">NEXT</button>
        </div>
    </div>

    <script>
        let currentStep = 1;
        const totalSteps = 4;

        function switchTab(step) {
            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step-' + step).classList.add('active');
            
            document.querySelectorAll('.dot').forEach((el, index) => {
                index + 1 <= step ? el.classList.add('active') : el.classList.remove('active');
            });

            // 按鈕狀態
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (step === 1) {
                prevBtn.style.opacity = "0";
                prevBtn.style.pointerEvents = "none";
            } else {
                prevBtn.style.opacity = "1";
                prevBtn.style.pointerEvents = "auto";
            }

            if (step === totalSteps) {
                nextBtn.innerText = "完成提案並確認";
                nextBtn.onclick = () => alert("大方向已擬定！將為您產出正式方案細節。");
            } else {
                nextBtn.innerText = "NEXT";
                nextBtn.onclick = () => nextStep(1);
            }
        }

        function nextStep(delta) {
            currentStep += delta;
            if (currentStep < 1) currentStep = 1;
            if (currentStep > totalSteps) currentStep = totalSteps;
            switchTab(currentStep);
        }

        function selectOption(el, step) {
            document.querySelectorAll(`#step-${step} .option-card`).forEach(card => card.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
