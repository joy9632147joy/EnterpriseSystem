<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/bootstrap.css">
    <script src="../js/bootstrap.bundle.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../ESCss/MainPage.css">
    <script src="../ESJS/MainPage.js"></script>

    <title>Enterprise System</title>
    <style>
        /* 內容區塊背景 */
        #content {
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        /* 頂部 Hero 卡片 */
        .profile-hero {
            background: #fff;
            border-radius: 12px;
            padding: 24px 30px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .avatar-container {
            position: relative;
            width: 85px;
            height: 85px;
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #f1f5f9;
        }

        .camera-trigger {
            position: absolute;
            bottom: 0;
            right: 0;
            background: #64748b;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 2px solid white;
        }

        /* 狀態標籤 */
        .badge-status {
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-fulltime {
            background: #f1f5f9;
            color: #475569;
        }

        /* 資訊卡片 */
        .info-card {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .card-header-custom {
            padding: 12px 20px;
            background: #fafafa;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1e293b;
        }

        .btn-edit-text {
            background: #f0f9ff;
            color: #0369a1;
            border: 1px solid #bae6fd;
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 6px;
        }

        /* 左側人員清單 Hover 與漸變效果 */
        .accordion-collapse .list-group-item-action {
            transition: all 0.2s ease-in-out;
        }

        /* 未選取狀態的 hover 效果 (淺藍灰色底) */
        .accordion-collapse .list-group-item-action:not(.active):hover {
            background-color: #f1f5f9 !important;
            transform: translateX(4px);
            /* 滑鼠游標靠近時微微向右浮動 */
        }

        /* 選取狀態 (Active) 的確保設定 */
        .accordion-collapse .list-group-item-action.active {
            background-color: #f8fafc !important;
            color: #000 !important;
        }
    </style>
</head>
